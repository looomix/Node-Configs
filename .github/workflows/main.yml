name: Node-Configs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - 'Files/**'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: node-configs-update
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Get full repository history

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Files/requirements.txt

      - name: 📂 Check input files
        run: |
          echo "Checking urls.txt:"
          cat Files/urls.txt || echo "urls.txt not found"
          echo "Checking key.json:"
          cat Files/key.json || echo "key.json not found"

      - name: 🕸️ Run scraping script
        run: |
          python Files/scrip.py || { echo "Scraper failed, check logs"; exit 1; }  # Run scraping script

      - name: 📂 Check directory contents
        run: |
          echo "Listing repository contents:"
          ls -R
          echo "Checking for configs:"
          ls -la configs/ || echo "configs does not exist or is empty"
          echo "Checking for README.md:"
          ls -la README.md || echo "README.md does not exist"

      - name: 🧪 Validate generated configs
        run: |
          python Files/check_config.py || { echo "生成的配置无法被客户端加载，已阻止提交"; exit 1; }

      - name: 🔬 Validate with real kernels
        run: |
          set -u
          MIHOMO_TAG=v1.19.34
          SINGBOX_TAG=1.14.4

          if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-compatible-${MIHOMO_TAG}.gz"; then
            gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
            mkdir -p /tmp/mihomo-home
            /tmp/mihomo -t -d /tmp/mihomo-home -f configs/clash/config.yaml \
              || { echo "mihomo 内核拒绝加载 configs/clash/config.yaml"; exit 1; }
            echo "mihomo 校验通过"
          else
            echo "::warning::mihomo 下载失败，跳过真实内核校验（Python 自检已通过）"
          fi

          if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_TAG}/sing-box-${SINGBOX_TAG}-linux-amd64.tar.gz"; then
            tar -xzf /tmp/sing-box.tar.gz -C /tmp
            "/tmp/sing-box-${SINGBOX_TAG}-linux-amd64/sing-box" check -c configs/singbox/config.json \
              || { echo "sing-box 内核拒绝加载 configs/singbox/config.json"; exit 1; }
            echo "sing-box 校验通过"
          else
            echo "::warning::sing-box 下载失败，跳过真实内核校验（Python 自检已通过）"
          fi

      - name: 🛠️ Create configs if not exists
        run: |
          mkdir -p configs
          touch configs/.gitkeep
          echo "Created configs/.gitkeep"

      - name: 🔧 Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: ⬆️ Commit and Push Changes
        run: |
          MSG="docs: Update README and config files $(date '+%Y-%m-%d %H:%M:%S')"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "$MSG"

          # 生成物每次都是全量重算，合并冲突没有意义：推送被其他运行抢先时，
          # 直接把本次生成结果重新落在远端最新提交之上，而不是去 rebase 一堆 YAML。
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "推送被拒绝（远端已有新提交），以本次生成结果重新提交，第 $attempt 次重试"
            git fetch origin main
            git reset --soft origin/main
            git add -A
            git commit -m "$MSG" || { echo "内容与远端一致，无需提交"; exit 0; }
            sleep 5
          done
          echo "连续 3 次推送失败"; exit 1
