name: Node-Configs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - 'Files/**'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: node-configs-update
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Get full repository history

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Files/requirements-dev.txt

      - name: 🧬 Run unit tests
        run: python -m pytest Files/tests -q

      - name: 📂 Check input files
        run: |
          echo "Checking urls.txt:"
          cat Files/urls.txt || echo "urls.txt not found"
          echo "Checking key.json:"
          cat Files/key.json || echo "key.json not found"

      - name: 🕸️ Run scraping script
        run: |
          python Files/scrip.py || { echo "Scraper failed, check logs"; exit 1; }  # Run scraping script

      - name: 📊 Append run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return default
          stats = load('stats.json', {})
          status = load('configs/status.json', {})
          lines = ['## Node-Configs 运行摘要', '']
          if stats:
              lines += [
                  '| 指标 | 数值 |', '|:---|:---|',
                  f"| 抓取链接 | {stats.get('links', 0)} |",
                  f"| Clash 可用节点 | {stats.get('clash', 0)} |",
                  f"| sing-box 可用节点 | {stats.get('singbox', 0)} |",
                  f"| 轻量版节点 | {stats.get('light', 0)} |",
                  f"| 分片文件 | {stats.get('splits', 0)} |",
                  f"| 源 | {stats.get('sources_ok', 0)}/{stats.get('sources_total', 0)} |",
              ]
          if status:
              lines += ['', '存活探测：{alive}/{checked} 可连通（{ratio}），剔除 {dropped}{reason}'.format(
                  alive=status.get('alive', 0), checked=status.get('checked', 0),
                  ratio=f"{float(status.get('alive_ratio') or 0):.1%}",
                  dropped=status.get('dropped', 0),
                  reason=f"（跳过原因：{status['skipped_reason']}）"
                         if status.get('skipped_reason') else '')]
          if stats.get('source_zero_streak'):
              zero = [u for u, n in stats['source_zero_streak'].items() if n]
              if zero:
                  lines += ['', '零产出源：'] + [f'- `{u}`' for u in zero]
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')
          else:
              print('\n'.join(lines))
          PY

      - name: 📂 Check directory contents
        run: |
          echo "Listing repository contents:"
          ls -R
          echo "Checking for configs:"
          ls -la configs/ || echo "configs does not exist or is empty"
          echo "Checking for README.md:"
          ls -la README.md || echo "README.md does not exist"

      - name: 🧪 Validate generated configs
        run: |
          python Files/check_config.py || { echo "生成的配置无法被客户端加载，已阻止提交"; exit 1; }

      - name: 🔬 Validate with real kernels
        run: |
          set -u
          MIHOMO_TAG=v1.19.34
          SINGBOX_TAG=1.14.4

          if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-compatible-${MIHOMO_TAG}.gz"; then
            gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
            mkdir -p /tmp/mihomo-home
            for cfg in configs/clash/config.yaml configs/clash/light.yaml; do
              /tmp/mihomo -t -d /tmp/mihomo-home -f "$cfg" \
                || { echo "mihomo 内核拒绝加载 $cfg"; exit 1; }
              echo "mihomo 校验通过：$cfg"
            done
          else
            echo "::warning::mihomo 下载失败，跳过真实内核校验（Python 自检已通过）"
          fi

          if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_TAG}/sing-box-${SINGBOX_TAG}-linux-amd64.tar.gz"; then
            tar -xzf /tmp/sing-box.tar.gz -C /tmp
            for cfg in configs/singbox/config.json configs/singbox/light.json; do
              "/tmp/sing-box-${SINGBOX_TAG}-linux-amd64/sing-box" check -c "$cfg" \
                || { echo "sing-box 内核拒绝加载 $cfg"; exit 1; }
              echo "sing-box 校验通过：$cfg"
            done
          else
            echo "::warning::sing-box 下载失败，跳过真实内核校验（Python 自检已通过）"
          fi

      - name: 🛠️ Create configs if not exists
        run: |
          mkdir -p configs
          touch configs/.gitkeep
          echo "Created configs/.gitkeep"

      - name: 🔧 Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: ⬆️ Commit and Push Changes
        run: |
          MSG="docs: Update README and config files $(date '+%Y-%m-%d %H:%M:%S')"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "$MSG"

          # 生成物每次都是全量重算，合并冲突没有意义：推送被其他运行抢先时，
          # 直接把本次生成结果重新落在远端最新提交之上，而不是去 rebase 一堆 YAML。
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "推送被拒绝（远端已有新提交），以本次生成结果重新提交，第 $attempt 次重试"
            git fetch origin main
            git reset --soft origin/main
            git add -A
            git commit -m "$MSG" || { echo "内容与远端一致，无需提交"; exit 0; }
            sleep 5
          done
          echo "连续 3 次推送失败"; exit 1
